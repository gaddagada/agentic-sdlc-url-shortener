# Optional infrastructure for local runs.
#
#   docker compose up -d postgres                      # PostgreSQL for the shortener's "postgres" profile
#   docker compose --profile apps up --build           # both applications in containers
#
# Default local development does not need Docker: both apps use file-based H2 out of the box.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Both applications bind to the loopback interface only. Required environment:
  #   SDLC_SECURITY_API_KEY   shared key clients must send as X-Api-Key to the control plane
  #   SHORTENER_IP_SALT       secret salt for visitor pseudonymization
  # Optional: ANTHROPIC_API_KEY for the Claude provider; SDLC_GOVERNANCE_SIGNING_KEY (base64:<value> of at least
  # 32 random bytes, e.g. from `openssl rand -base64 32`) to sign release change records (unsigned when empty).
  url-shortener:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: url-shortener/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shortener
      SHORTENER_DB_USER: shortener
      SHORTENER_DB_PASSWORD: shortener
      SHORTENER_BASE_URL: http://localhost:8080
      SHORTENER_ANALYTICS_IP_SALT: ${SHORTENER_IP_SALT:?set SHORTENER_IP_SALT to a secret value}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: orchestrator-app/Dockerfile
    environment:
      SDLC_SECURITY_API_KEY: ${SDLC_SECURITY_API_KEY:?set SDLC_SECURITY_API_KEY to protect the control plane API}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Passed through unchanged; empty leaves release change records unsigned. Never logged by the control plane.
      SDLC_GOVERNANCE_SIGNING_KEY: ${SDLC_GOVERNANCE_SIGNING_KEY:-}
      SDLC_LLM_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  pgdata: {}
