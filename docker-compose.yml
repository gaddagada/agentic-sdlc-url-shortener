# Optional infrastructure for local runs.
#
#   docker compose up -d postgres                      # PostgreSQL for the shortener's "postgres" profile
#   docker compose --profile apps up --build           # both applications in containers
#
# Default local development does not need Docker: both apps use file-based H2 out of the box.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  url-shortener:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: url-shortener/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shortener
      SHORTENER_DB_USER: shortener
      SHORTENER_DB_PASSWORD: shortener
      SHORTENER_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: orchestrator-app/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SDLC_LLM_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8090:8090"

volumes:
  pgdata: {}
