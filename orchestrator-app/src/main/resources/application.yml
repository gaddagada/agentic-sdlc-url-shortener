server:
  port: 8090

spring:
  application:
    name: sdlc-orchestrator
  profiles:
    # Without an active profile the "local" posture applies (application-local.yml): open API, four-eyes off.
    # Production: --spring.profiles.active=prod (application-prod.yml; SecurityPostureValidator refuses unsafe settings).
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    # Embedded file database owned by this process (no AUTO_SERVER: no TCP listener for other processes).
    # PostgreSQL: run with the "postgres" profile (application-postgres.yml).
    url: jdbc:h2:file:./data/orchestrator
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Instants are stored in TIMESTAMP columns as UTC wall-clock time.
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  mvc:
    problemdetails:
      enabled: true

management:
  # Tracing: Micrometer observations (HTTP requests, the sdlc.run and sdlc.stage observations of runs and stage
  # attempts) become OpenTelemetry spans. They are exported over OTLP only when an endpoint is set, for example
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces; without one, spans stay
  # in the process (nothing is sent anywhere). Never set the endpoint to an empty value (Spring Boot then treats it as
  # configured); management.tracing.export.otlp.enabled=false switches the export off instead. Metrics are not pushed
  # over OTLP; they remain on /actuator/metrics.
  tracing:
    sampling:
      probability: 1.0                   # low-traffic control plane: keep every trace (lower it for busy deployments)
  metrics:
    observations:
      # Observations become timers (sdlc.run, sdlc.stage, http.server.requests) but no long task timers: those would be
      # named sdlc.run.active, which is the existing timer of the active time of completed runs, and every open event
      # stream would count as an in-flight HTTP request for up to sdlc.console.sse-timeout.
      ignored-meters: long-task-timer
  # opentelemetry:                     # service.name defaults to spring.application.name
  #   tracing:
  #     export:
  #       otlp:
  #         endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics       # local evaluation; the prod profile exposes health only (operators opt in)
  endpoint:
    health:
      # Component statuses (db, diskSpace, workspaceIndex, ...) are shown; their details are not.
      show-details: never
      show-components: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Error responses are rendered by ApiExceptionHandler; do not attach its handlers to every operation.
  override-with-generic-response: false
  paths-to-match: /api/**

sdlc:
  workspace:
    # root: detected by walking up from the working directory to the directory containing pom.xml and url-shortener
    enabled: true
  engine:
    ambiguity-threshold: 0.5
    sandbox-enabled: false
    verify-build-enabled: false
    backoff-scale: 1.0
    sandbox-root: sandbox
    llm-timeout-scale: 3.0               # stage timeouts x3 when an LLM provider executes the attempt
    build-command: ./mvnw -B -ntp -q verify   # the only command a sandbox build may run
    # Multi-node operation: a node leases a run while it executes the run's stages; other nodes refuse commands on it
    # (HTTP 409 run-leased-elsewhere) until the run waits for a human, ends, or the lease expires (node crashed).
    lease-provider: jdbc                 # jdbc: run_leases table shared by all nodes of the database | memory: one node
    lease-ttl: 60s                       # renewed while the run executes; must exceed 30 s max retry backoff x backoff-scale
    # node-id: orchestrator-1            # unique per process (SDLC_ENGINE_NODEID); default: host name, pid, random suffix
    registry-retention: 1h               # runs not executing here leave memory after this idle time (reloaded on demand)
    registry-max-terminal-runs: 500      # completed and aborted runs kept in memory at most
    maintenance-interval: 30s            # fixed delay of recovery (runs of a dead node, once its lease expired) + eviction
    # Optional external dependency scanner run by the security review of REPO runs, inside the run's sandbox (needs
    # sandbox-enabled), through the same build runner and allow-list as build-command (Maven commands only). Only its
    # exit status and the first 2000 characters of its output are recorded; a non-zero exit is a HIGH finding. Unset:
    # no external scan (the built-in dependency inventory of the POMs still runs; it is not a CVE scan).
    # dependency-scan-command: ./mvnw -B -ntp -q org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
    dependency-scan-timeout: 5m
  security:
    # open (default; every caller holds every role) | api-key | oidc. When unset and api-key is set, api-key applies.
    # mode: open
    api-key: ""                          # X-Api-Key value required on /api/** in api-key mode (SDLC_SECURITY_API_KEY)
    public-docs: true                    # false: /v3/api-docs/** and /swagger-ui/** need the same authentication as GET /api/**
    oidc:
      # issuer-uri: https://idp.example.com/realms/sdlc   # keys discovered on first use; iss validated
      # jwk-set-uri: https://idp.example.com/realms/sdlc/protocol/openid-connect/certs
      # audience: sdlc-orchestrator                       # required in oidc mode: aud must contain it
      roles-claim: roles                 # claim name or dotted path, e.g. realm_access.roles
      identity-claim: sub                # operator id claim, often preferred_username
      role-mapping:                      # claim values granting each role (comma separated lists allowed)
        operator: operator
        approver: approver
        admin: admin
  console:
    enabled: true
    # Server-sent event streams of the console (GET /api/v1/runs/events, GET /api/v1/runs/{id}/events). They carry
    # the run changes committed by THIS node only: with several nodes, the console polls runs held by other nodes
    # (it compares the X-Sdlc-Node-Id header of the stream with the run's nodeId) and keeps a 30 s safety poll.
    max-sse-connections: 200             # concurrent streams of this node; more are refused with 503 (stream-limit-reached)
    sse-heartbeat-interval: 15s          # "heartbeat" event on every open stream (keeps proxies from closing it)
    sse-timeout: 30m                     # lifetime of one stream; the client reconnects with Last-Event-ID
  metrics:
    cache-ttl: 5s                        # GET /api/v1/metrics/reliability reads every run of the store; reuse the result
  # Policy as code: a JSON or YAML policy pack evaluated after the built-in rules (it may disable built-in rules
  # except CHG-002, GOV-003 and SEC-002). A file path or classpath:<resource>; an invalid pack fails startup with
  # every problem listed. Unset: built-in rules only. Environment variable: SDLC_POLICY_PACK.
  # policy:
  #   pack: classpath:policy/example-policy-pack.yaml
  evaluation:
    # POST /api/v1/evaluation/suite/run (ADMIN): the bundled evaluation suite on isolated in-memory engines with the
    # deterministic agents. Enabled by the local profile, disabled by the prod profile.
    enabled: false
  agents:
    default-provider: deterministic         # deterministic | anthropic | ollama
  governance:
    # true: the release-readiness gate cannot be approved by the operator who started the run or approved its design
    four-eyes: false
    # HMAC-SHA256 key that signs the release change record when a run completes: base64:<value> or raw text, at least
    # 32 bytes (generate with: openssl rand -base64 32). Empty: change records are unsigned (refused by the prod
    # profile). The key is never logged; artifact views report signatureVerified against it.
    signing-key: ${SDLC_GOVERNANCE_SIGNING_KEY:}
    signing-key-id: local                # recorded with every signature (key rotation); must not reveal the key
  llm:
    anthropic:
      enabled: true
      model: claude-opus-5-5
      api-key: ${ANTHROPIC_API_KEY:}
      max-output-tokens: 64000             # responses are streamed; a full change set needs this much
      timeout: 900s                        # one streamed call; stage timeouts are x3 for LLM attempts
    ollama:
      enabled: true
      base-url: http://localhost:11434
      model: qwen2.5-coder:7b
      timeout: 240s
    # LLM cost estimation: US dollars per million tokens per provider, as a provider "default" and per model name or
    # model-name prefix ("claude-opus-5" also prices "claude-opus-5-5"). No prices ship with the application: copy them
    # from the provider's CURRENT price list (they change and differ by contract). Without a price, calls are counted
    # as unpriced and run costs are unknown. Cache prices default to the input price. Names with dots need brackets,
    # e.g. models: { "[qwen2.5-coder:7b]": {...} }. The values below are placeholders, not real prices.
    # pricing:
    #   providers:
    #     anthropic:
    #       models:
    #         claude-opus-5:
    #           input-per-million: 0.00
    #           output-per-million: 0.00
    #           cache-read-per-million: 0.00
    #           cache-write-per-million: 0.00
    #     ollama:
    #       default:                     # local models: no per-token charge
    #         input-per-million: 0
    #         output-per-million: 0
