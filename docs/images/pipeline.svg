<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1400" height="520" viewBox="0 0 1400 520" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1f2328" role="img" aria-labelledby="title desc">
  <title id="title">SDLC workflow graph (sdlc-default, version 1)</title>
  <desc id="desc">Ten stages as a left-to-right dependency graph: intake fans out to decompose and impact (parallel), which join at design; design fans out to implement and test-design (parallel); verify joins implement and test-design; document and security-scan run in parallel after implement; release-readiness joins verify, document and security-scan. Human gates: clarification gate on intake, risk-based approval on design, risk-based or policy approval on implement, release approval (always) on release-readiness. A bounded feedback loop runs from verify back to implement.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      text { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .h1 { font-size: 20px; font-weight: 700; }
      .lead { font-size: 13px; fill: #57606a; }
      .id { font-size: 14px; font-weight: 600; }
      .role { font-size: 12px; fill: #57606a; }
      .node { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
      .gated { fill: #ffffff; stroke: #8250df; stroke-opacity: 0.6; stroke-width: 1.4; }
      .edge { fill: none; stroke: #57606a; stroke-width: 1.5; }
      .band { fill: #ddf4ff; fill-opacity: 0.45; stroke: #0969da; stroke-opacity: 0.35; stroke-dasharray: 5 4; }
      .bandlbl { font-size: 11px; font-weight: 700; fill: #0969da; letter-spacing: 0.04em; }
      .gate { font-size: 12px; font-weight: 600; fill: #8250df; }
      .join { font-size: 11px; font-weight: 700; fill: #57606a; letter-spacing: 0.04em; }
      .fb { font-size: 12px; font-weight: 600; fill: #9a6700; }
      .lg { font-size: 12px; fill: #1f2328; }
      .lgh { font-size: 12px; font-weight: 700; fill: #57606a; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
    <symbol id="lock" viewBox="0 0 12 15">
      <path d="M3.2,7 V4.8 a2.8,2.8 0 0 1 5.6,0 V7" fill="none" stroke="#8250df" stroke-width="1.7"/>
      <rect x="1" y="6.6" width="10" height="8" rx="1.8" fill="#8250df"/>
    </symbol>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#eaeef2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6e7781" stroke-width="2.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dy="1" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="1399" height="519" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="h1" x="36" y="36">SDLC workflow graph <tspan class="mono" font-size="14" font-weight="400" fill="#57606a">sdlc-default v1</tspan></text>
  <text class="lead" x="36" y="57">Ten stages with declared dependencies. Parallel branches run concurrently; a join starts only when every predecessor has SUCCEEDED.</text>

  <!-- parallel bands -->
  <rect class="band" x="256" y="154" width="192" height="152" rx="12"/>
  <rect x="317" y="145" width="70" height="18" rx="9" fill="#ffffff" stroke="#0969da" stroke-opacity="0.5"/>
  <text class="bandlbl" x="352" y="158" text-anchor="middle">parallel</text>

  <rect class="band" x="712" y="76" width="208" height="222" rx="12"/>
  <rect x="781" y="67" width="70" height="18" rx="9" fill="#ffffff" stroke="#0969da" stroke-opacity="0.5"/>
  <text class="bandlbl" x="816" y="80" text-anchor="middle">parallel</text>

  <rect class="band" x="952" y="278" width="192" height="152" rx="12"/>
  <rect x="1013" y="269" width="70" height="18" rx="9" fill="#ffffff" stroke="#0969da" stroke-opacity="0.5"/>
  <text class="bandlbl" x="1048" y="282" text-anchor="middle">parallel</text>

  <!-- edges -->
  <path class="edge" d="M204,230 C236,230 236,194 267,194" marker-end="url(#arrow)"/>
  <path class="edge" d="M204,230 C236,230 236,266 267,266" marker-end="url(#arrow)"/>
  <path class="edge" d="M436,194 C468,194 468,230 499,230" marker-end="url(#arrow)"/>
  <path class="edge" d="M436,266 C468,266 468,230 499,230" marker-end="url(#arrow)"/>
  <path class="edge" d="M668,230 C700,230 700,116 731,116" marker-end="url(#arrow)"/>
  <path class="edge" d="M668,230 H731" marker-end="url(#arrow)"/>
  <path class="edge" d="M900,230 H963" marker-end="url(#arrow)"/>
  <path class="edge" d="M900,116 H1086 Q1110,116 1110,140 V203" marker-end="url(#arrow)"/>
  <path class="edge" d="M900,230 C932,230 932,318 963,318" marker-end="url(#arrow)"/>
  <path class="edge" d="M900,230 C932,230 932,390 963,390" marker-end="url(#arrow)"/>
  <path class="edge" d="M1132,230 H1195" marker-end="url(#arrow)"/>
  <path class="edge" d="M1132,318 C1164,318 1164,230 1195,230" marker-end="url(#arrow)"/>
  <path class="edge" d="M1132,390 C1164,390 1164,230 1195,230" marker-end="url(#arrow)"/>

  <!-- feedback loop verify -> implement -->
  <path d="M1040,204 C1040,174 816,174 816,203" fill="none" stroke="#9a6700" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <rect x="813" y="148" width="230" height="22" rx="11" fill="#fff8c5" stroke="#9a6700" stroke-opacity="0.45"/>
  <text class="fb" x="928" y="163" text-anchor="middle">feedback loop (bounded: max 2)</text>

  <!-- nodes -->
  <g filter="url(#shadow)">
    <rect class="gated" x="36" y="204" width="168" height="52" rx="10"/>
    <rect class="node" x="268" y="168" width="168" height="52" rx="10"/>
    <rect class="node" x="268" y="240" width="168" height="52" rx="10"/>
    <rect class="gated" x="500" y="204" width="168" height="52" rx="10"/>
    <rect class="node" x="732" y="90" width="168" height="52" rx="10"/>
    <rect class="gated" x="732" y="204" width="168" height="52" rx="10"/>
    <rect class="node" x="964" y="204" width="168" height="52" rx="10"/>
    <rect class="node" x="964" y="292" width="168" height="52" rx="10"/>
    <rect class="node" x="964" y="364" width="168" height="52" rx="10"/>
    <rect class="gated" x="1196" y="204" width="168" height="52" rx="10"/>
  </g>

  <text class="id" x="50" y="228">intake</text>
  <text class="role" x="50" y="246">Requirements</text>
  <use xlink:href="#lock" x="178" y="214" width="12" height="15"/>

  <text class="id" x="282" y="192">decompose</text>
  <text class="role" x="282" y="210">Planning</text>

  <text class="id" x="282" y="264">impact</text>
  <text class="role" x="282" y="282">Codebase analysis</text>

  <text class="id" x="514" y="228">design</text>
  <text class="role" x="514" y="246">Architecture</text>
  <use xlink:href="#lock" x="642" y="214" width="12" height="15"/>

  <text class="id" x="746" y="114">test-design</text>
  <text class="role" x="746" y="132">Test design</text>

  <text class="id" x="746" y="228">implement</text>
  <text class="role" x="746" y="246">Implementation</text>
  <use xlink:href="#lock" x="874" y="214" width="12" height="15"/>

  <text class="id" x="978" y="228">verify</text>
  <text class="role" x="978" y="246">Verification</text>

  <text class="id" x="978" y="316">document</text>
  <text class="role" x="978" y="334">Documentation</text>

  <text class="id" x="978" y="388">security-scan</text>
  <text class="role" x="978" y="406">Security review</text>

  <text class="id" x="1210" y="228">release-readiness</text>
  <text class="role" x="1210" y="246">Release</text>
  <use xlink:href="#lock" x="1338" y="214" width="12" height="15"/>

  <!-- join tabs -->
  <rect x="508" y="186" width="40" height="18" rx="6" fill="#eaeef2" stroke="#8c959f"/>
  <text class="join" x="528" y="199" text-anchor="middle">join</text>
  <rect x="972" y="186" width="40" height="18" rx="6" fill="#eaeef2" stroke="#8c959f"/>
  <text class="join" x="992" y="199" text-anchor="middle">join</text>
  <rect x="1204" y="186" width="40" height="18" rx="6" fill="#eaeef2" stroke="#8c959f"/>
  <text class="join" x="1224" y="199" text-anchor="middle">join</text>

  <!-- human gate tags -->
  <rect x="40" y="266" width="160" height="22" rx="11" fill="#fbefff" stroke="#8250df" stroke-opacity="0.45"/>
  <use xlink:href="#lock" x="52" y="269" width="12" height="15"/>
  <text class="gate" x="70" y="281">clarification gate</text>

  <rect x="501" y="266" width="166" height="22" rx="11" fill="#fbefff" stroke="#8250df" stroke-opacity="0.45"/>
  <use xlink:href="#lock" x="513" y="269" width="12" height="15"/>
  <text class="gate" x="531" y="281">risk-based approval</text>

  <rect x="731" y="266" width="170" height="22" rx="11" fill="#fbefff" stroke="#8250df" stroke-opacity="0.45" stroke-dasharray="4 3"/>
  <use xlink:href="#lock" x="743" y="269" width="12" height="15"/>
  <text class="gate" x="761" y="281">risk-based / policy</text>

  <rect x="1177" y="266" width="206" height="22" rx="11" fill="#fbefff" stroke="#8250df" stroke-opacity="0.45"/>
  <use xlink:href="#lock" x="1189" y="269" width="12" height="15"/>
  <text class="gate" x="1207" y="281">release approval (always)</text>

  <!-- stage contract -->
  <rect x="36" y="320" width="560" height="118" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="lgh" x="52" y="343">Every stage declares</text>
  <text class="lg" x="52" y="366" font-weight="600">Attempts</text>
  <text class="lg" x="136" y="366">3 per stage (verify, security-scan, release-readiness: 2), first try included</text>
  <text class="lg" x="52" y="386" font-weight="600">Backoff</text>
  <text class="lg" x="136" y="386">initial backoff × multiplier<tspan dy="-5" font-size="11">attempt−1</tspan><tspan dy="5">, capped at 30 s</tspan></text>
  <text class="lg" x="52" y="406" font-weight="600">Timeout</text>
  <text class="lg" x="136" y="406">per attempt: 3 min (implement 5 min, verify 10 min)</text>
  <text class="lg" x="52" y="426" font-weight="600">Fallback</text>
  <text class="lg" x="136" y="426">attempts exhausted → the deterministic agent takes over</text>

  <!-- legend -->
  <line x1="36" y1="452" x2="1364" y2="452" stroke="#d0d7de"/>
  <text class="lgh" x="36" y="485">Stage status</text>

  <rect x="128" y="474" width="14" height="14" rx="3" fill="#8c959f"/>
  <text class="lg mono" x="148" y="485">PENDING</text>
  <rect x="222" y="474" width="14" height="14" rx="3" fill="#0969da"/>
  <text class="lg mono" x="242" y="485">RUNNING</text>
  <rect x="316" y="474" width="14" height="14" rx="3" fill="#9a6700"/>
  <text class="lg mono" x="336" y="485">RETRY_SCHEDULED</text>
  <rect x="470" y="474" width="14" height="14" rx="3" fill="#8250df"/>
  <text class="lg mono" x="490" y="485">AWAITING_*</text>
  <rect x="586" y="474" width="14" height="14" rx="3" fill="#1a7f37"/>
  <text class="lg mono" x="606" y="485">SUCCEEDED</text>
  <rect x="696" y="474" width="14" height="14" rx="3" fill="#cf222e"/>
  <text class="lg mono" x="716" y="485">FAILED</text>
  <rect x="780" y="474" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#6e7781"/>
  <text class="lg mono" x="800" y="485">STALE</text>
  <rect x="858" y="474" width="14" height="14" rx="3" fill="#424a53"/>
  <text class="lg mono" x="878" y="485">CANCELLED</text>

  <line x1="984" y1="481" x2="1016" y2="481" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="lg" x="1024" y="485">depends on</text>
  <line x1="1104" y1="481" x2="1136" y2="481" stroke="#9a6700" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text class="lg" x="1144" y="485">feedback</text>
  <use xlink:href="#lock" x="1222" y="473" width="12" height="15"/>
  <text class="lg" x="1240" y="485">human gate</text>
</svg>
