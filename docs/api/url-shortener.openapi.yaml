        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: Request path.
        errors:
          type: array
          description: Present on `validation-error`.
          items:
            $ref: '#/components/schemas/FieldViolation'
        reason:
          type: string
          enum: [EXPIRED, DISABLED]
          description: Present on `link-gone`.
        maxItems:
          type: integer
          format: int32
          description: Present on `batch-too-large`; the largest batch this client can send (rate-limit capacity).

    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Offending body field, query parameter or header name.
        message:
          type: string
