openapi: 3.1.0
info:
  title: SDLC Orchestrator API
  description: "Control plane of the agentic SDLC orchestrator: start runs, govern\
    \ them (approve, reject, clarify, re-plan, stop, resume), follow them live (server-sent\
    \ events) and inspect artifacts, lineage, audit trail, evaluation scores, the\
    \ policy in force and reliability metrics. Every POST names the operator: the\
    \ X-Operator-Id header (open and api-key mode) or the identity claim of the bearer\
    \ token (oidc mode). Roles: OPERATOR starts and steers runs, APPROVER decides\
    \ gates, ADMIN re-indexes the workspace and runs the evaluation suite, any role\
    \ reads (see x-required-roles). Errors are RFC 9457 Problem Details."
  license:
    name: Apache-2.0
  version: v1
servers:
- url: http://localhost:8090
  description: Generated server url
security:
- apiKey: []
- bearerAuth: []
- {}
tags:
- name: Scenarios
  description: Executable demo scenarios
- name: Metrics
  description: Reliability metrics
- name: Workflow
  description: Workflow definition
- name: Run events
  description: Server-sent event streams of runs and of the runs list
- name: Workspace
  description: Codebase index of the repository workspace
- name: Evaluation
  description: Artifact quality scores and the evaluation suite
- name: Providers
  description: Agent providers
- name: Run evidence
  description: "Artifacts, lineage and audit trail of a run"
- name: Policy
  description: Built-in rules and the active policy pack
- name: Runs
  description: Run lifecycle and governance commands
paths:
  /api/v1/workspace/reindex:
    post:
      tags:
      - Workspace
      summary: Rebuild the codebase index
      operationId: reindexWorkspace
      parameters:
      - name: X-Operator-Id
        in: header
        description: "Id of the human operator issuing the request (recorded in the\
          \ audit trail; engine, system, deterministic and fallback:* are reserved).\
          \ Required in open and api-key mode; optional in oidc mode, where the operator\
          \ is the token's identity claim and a different value is refused with 400"
        required: true
        schema:
          type: string
          pattern: "[A-Za-z0-9._@-]{1,64}"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkspaceIndexView"
        "401":
          description: "Not authenticated: X-Api-Key missing or wrong (api-key mode),\
            \ bearer token missing, expired or invalid (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Authenticated, but the caller does not hold a role in x-required-roles\
            \ (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-roles:
      - ADMIN
  /api/v1/scenarios/{key}/run:
    post:
      tags:
      - Scenarios
      summary: Start a run of a scenario
      description: The optional body overrides the provider and the budget; the provider
        may also be given as the provider query parameter (a different provider in
        the body is refused with 400).
      operationId: runScenario
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: provider
        in: query
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 32
          minLength: 0
      - name: X-Operator-Id
        in: header
        description: "Id of the human operator issuing the request (recorded in the\
          \ audit trail; engine, system, deterministic and fallback:* are reserved).\
          \ Required in open and api-key mode; optional in oidc mode, where the operator\
          \ is the token's identity claim and a different value is refused with 400"
        required: true
        schema:
          type: string
          pattern: "[A-Za-z0-9._@-]{1,64}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunScenarioRequest"
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunView"
        "400":
          description: "Invalid request: validation failed (see errors), malformed\
            \ JSON, a missing, malformed or reserved X-Operator-Id, or (oidc mode)\
            \ an X-Operator-Id that differs from the token identity"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Not authenticated: X-Api-Key missing or wrong (api-key mode),\
            \ bearer token missing, expired or invalid (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Authenticated, but the caller does not hold a role in x-required-roles\
            \ (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Unknown run, scenario or artifact, or an operation disabled\
            \ by configuration (type feature-disabled)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "Refused in the current state: wrong run or stage state, stale\
            \ approvalId, invalid command (exhausted budget, missing waiver, ...),\
            \ four-eyes rule, unavailable agent provider, the run is executing on\
            \ another engine node (type run-leased-elsewhere, with holder and runId),\
            \ or an evaluation suite run is already in progress (type evaluation-in-progress)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "The control plane is shutting down, or (event streams) this\
            \ node serves the maximum number of streams (type stream-limit-reached,\
            \ with Retry-After)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-roles:
      - OPERATOR
  /api/v1/runs:
    get:
      tags:
      - Runs
      summary: List runs (paged and filterable)
      description: "Returns {items, page, size, total, totalPages, sort}. Items are\
        \ RunSummaryView rows read from the runs table (no run snapshot is read):\
        \ pendingActions and progress are null for rows not saved since the column\
        \ was added. Filters are exact matches combined with AND: status (RUNNING,\
        \ WAITING_HUMAN, SAFE_STOPPED, COMPLETED, ABORTED; repeatable or comma separated),\
        \ scenario, startedBy. sort is <field>[,asc|desc] with field one of createdAt,\
        \ updatedAt, endedAt, status, scenario, startedBy (ties broken by id); any\
        \ other field is a 400. size is 1..200. Breaking change: this operation returned\
        \ a bare array before the paged envelope."
      operationId: listRuns
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: status
        in: query
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
      - name: scenario
        in: query
        required: false
        schema:
          type:
          - string
          - "null"
      - name: startedBy
        in: query
        required: false
        schema:
          type:
          - string
          - "null"
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: "updatedAt,desc"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunPageView"
        "400":
          description: "Invalid request: validation failed (see errors), malformed\
            \ JSON, a missing, malformed or reserved X-Operator-Id, or (oidc mode)\
            \ an X-Operator-Id that differs from the token identity"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Not authenticated: X-Api-Key missing or wrong (api-key mode),\
            \ bearer token missing, expired or invalid (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Authenticated, but the caller does not hold a role in x-required-roles\
            \ (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-roles:
      - OPERATOR
      - APPROVER
      - ADMIN
    post:
      tags:
      - Runs
      summary: Start a run
      operationId: createRun
      parameters:
      - name: X-Operator-Id
        in: header
        description: "Id of the human operator issuing the request (recorded in the\
          \ audit trail; engine, system, deterministic and fallback:* are reserved).\
          \ Required in open and api-key mode; optional in oidc mode, where the operator\
          \ is the token's identity claim and a different value is refused with 400"
        required: true
        schema:
          type: string
          pattern: "[A-Za-z0-9._@-]{1,64}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunView"
        "400":
          description: "Invalid request: validation failed (see errors), malformed\
            \ JSON, a missing, malformed or reserved X-Operator-Id, or (oidc mode)\
            \ an X-Operator-Id that differs from the token identity"
          content:
            application/problem+json:
