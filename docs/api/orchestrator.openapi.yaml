        \ (null for the deterministic agents and for providers disabled by configuration).\
        \ While it is OPEN, new attempts run the deterministic agents instead of the\
        \ provider until retryAt; then it is HALF_OPEN and the next attempt tries\
        \ the provider again. lastFailure has credential-like tokens redacted and\
        \ is at most 200 characters."
      operationId: listProviders
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderView"
        "401":
          description: "Not authenticated: X-Api-Key missing or wrong (api-key mode),\
            \ bearer token missing, expired or invalid (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Authenticated, but the caller does not hold a role in x-required-roles\
            \ (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-roles:
      - OPERATOR
      - APPROVER
      - ADMIN
  /api/v1/policy:
    get:
      tags:
      - Policy
      summary: Get the policy in force (built-in rules and the active policy pack)
      operationId: getPolicy
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyView"
        "401":
          description: "Not authenticated: X-Api-Key missing or wrong (api-key mode),\
            \ bearer token missing, expired or invalid (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Authenticated, but the caller does not hold a role in x-required-roles\
            \ (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-roles:
      - OPERATOR
      - APPROVER
      - ADMIN
  /api/v1/metrics/reliability:
    get:
      tags:
      - Metrics
      summary: Get reliability metrics over all runs
      description: "Computed over every run of the store (expensive: every run is\
        \ read); the result is reused for sdlc.metrics.cache-ttl (5 s by default),\
        \ so it may lag the latest changes by that much."
      operationId: getReliabilityMetrics
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReliabilityMetricsView"
        "401":
          description: "Not authenticated: X-Api-Key missing or wrong (api-key mode),\
            \ bearer token missing, expired or invalid (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Authenticated, but the caller does not hold a role in x-required-roles\
            \ (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-roles:
      - OPERATOR
      - APPROVER
      - ADMIN
