  securitySchemes:
    apiKey:
      type: apiKey
      description: "Shared key required on /api/** in api-key mode (sdlc.security.mode=api-key,\
        \ or sdlc.security.api-key set without a mode); not checked in the other modes"
      name: X-Api-Key
      in: header
    bearerAuth:
      type: http
      description: "OIDC access token required in oidc mode: RS256-signed by the configured\
        \ issuer, aud containing sdlc.security.oidc.audience; roles from sdlc.security.oidc.roles-claim,\
        \ operator id from sdlc.security.oidc.identity-claim"
      scheme: bearer
      bearerFormat: JWT
