  /api/v1/runs/{id}/events:
    get:
      tags:
      - Run events
      summary: Stream the changes of a run (server-sent events)
      description: "Server-sent events (text/event-stream). Every event's data is\
        \ one JSON document. On connect: the audit events after Last-Event-ID (all\
        \ without it) as 'audit' events (SSE id = audit seq, data = AuditEventView),\
        \ then the current 'run' (RunView). Then, for every change this node commits:\
        \ the new 'audit' events, then the new 'run'. 'heartbeat' every sdlc.console.sse-heartbeat-interval\
        \ (15 s), data {\"time\": ISO-8601}. When the run is COMPLETED or ABORTED\
        \ the stream ends after its final 'run' event. Reconnect with Last-Event-ID\
        \ to resume without gaps. Only commits of this node are streamed (header X-Sdlc-Node-Id);\
        \ poll runs held by other nodes. 503 (stream-limit-reached, Retry-After) beyond\
        \ sdlc.console.max-sse-connections."
      operationId: streamRunEvents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        description: Last audit seq the client received (resume point)
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: text/event-stream
        "401":
          description: "Not authenticated: X-Api-Key missing or wrong (api-key mode),\
            \ bearer token missing, expired or invalid (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Authenticated, but the caller does not hold a role in x-required-roles\
            \ (oidc mode)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Unknown run, scenario or artifact, or an operation disabled\
            \ by configuration (type feature-disabled)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "The control plane is shutting down, or (event streams) this\
            \ node serves the maximum number of streams (type stream-limit-reached,\
            \ with Retry-After)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-roles:
      - OPERATOR
      - APPROVER
      - ADMIN
