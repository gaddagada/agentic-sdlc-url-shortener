version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The Maven wrapper is pinned to the 3.9 line with a verified checksum; bump deliberately.
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      spring:
        patterns:
          - "org.springframework*"
      test-libraries:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.awaitility*"
          - "com.tngtech.archunit*"
          - "org.testcontainers*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - "/url-shortener"
      - "/orchestrator-app"
    schedule:
      interval: weekly
    ignore:
      # The project targets Java 25 LTS. The Maven build image is pinned to a tag that carries both the Maven
      # and the JDK version (maven:3.9.16-eclipse-temurin-25); Dependabot cannot express "same JDK, newer
      # Maven" for such tags and has proposed Java 26 images twice, so it is bumped by hand.
      - dependency-name: "maven"
      # Runtime image: patch and minor tags of Java 25 are welcome, the next major is not.
      - dependency-name: "eclipse-temurin"
        versions: [">= 26"]
